name: DB Push

on:
  push:
    branches: ['main']
    paths: ['supabase/migrations/**', '.github/workflows/db-push.yml']

permissions:
  contents: read

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link project
        if: hashFiles('supabase/migrations/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        if: hashFiles('supabase/migrations/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Seed rental dates are relative to today, so reseeding would duplicate
      # them. Only seed when the fixed reference tables are still empty.
      - name: Seed empty database
        if: hashFiles('supabase/migrations/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          reference_rows=$(supabase db query --linked -o csv \
            "select (select count(*) from purpose_settings) + (select count(*) from pricing_plans)" | tail -n 1)
          if [ "$reference_rows" = "0" ]; then
            supabase db push --linked --include-seed
            echo "Seeded: purpose_settings and pricing_plans were empty"
          else
            echo "Skipped seed: purpose_settings and pricing_plans hold $reference_rows rows"
          fi
